<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Network Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f12;
            color: #e2e8f0;
            padding: 30px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        .subtitle { color: #94a3b8; margin-bottom: 25px; }
        .stats-dashboard {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 450px;
        }
        .stat-card {
            background: #1e1e24;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            border: 1px solid #2e2e38;
        }
        .stat-num { font-size: 1.3rem; font-weight: bold; }
        .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        .controls { width: 100%; max-width: 450px; margin-bottom: 20px; }
        .search-bar {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2e2e38;
            background: #1e1e24;
            color: #fff;
            box-sizing: border-box;
        }
        .site-list { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 450px; }
        .site-item {
            display: flex;
            align-items: center;
            background: #1e1e24;
            padding: 15px;
            border-radius: 10px;
            justify-content: space-between;
            border: 1px solid #2e2e38;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }
        .site-item.visible { opacity: 1; transform: translateY(0); }
        .site-info a { color: #fff; text-decoration: none; font-weight: bold; }
        .site-info a:hover { color: #38bdf8; }
        .status-container { display: flex; align-items: center; gap: 8px; }
        .status-text { font-size: 0.8rem; color: #64748b; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #475569; }
        .status-dot.online { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-dot.offline { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
    </style>
</head>
<body>

    <h1>Game Network Status</h1>
    <p class="subtitle">Checking accessible game platforms on your Wi-Fi...</p>

    <div class="stats-dashboard">
        <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#22c55e" id="stat-open">0</div><div class="stat-label">Open</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#ef4444" id="stat-blocked">0</div><div class="stat-label">Blocked</div></div>
    </div>

    <div class="controls">
        <input type="text" class="search-bar" id="search-input" placeholder="Search game sites...">
    </div>

    <div class="site-list" id="links-container"></div>

    <script>
        const gameSites = [
            { name: "Poki", url: "https://poki.com" },
            { name: "CrazyGames", url: "https://crazygames.com" },
            { name: "Armor Games", url: "https://armorgames.com" },
            { name: "Kongregate", url: "https://kongregate.com" },
            { name: "Y8 Games", url: "https://y8.com" },
            { name: "Coolmath Games", url: "https://coolmathgames.com" },
            { name: "Newgrounds", url: "https://newgrounds.com" },
            { name: "Voxiom.io", url: "https://voxiom.io" },
            { name: "iogames.space", url: "https://iogames.space" },
            { name: "Scratch Games", url: "https://mit.edu" }
        ];

        let activeStatuses = {}; 
        const container = document.getElementById('links-container');
        document.getElementById('stat-total').textContent = gameSites.length;

        async function loadSites() {
            for (let i = 0; i < gameSites.length; i++) {
                await new Promise(r => setTimeout(r, 200));
                createSiteElement(gameSites[i]);
            }
        }

        function createSiteElement(site) {
            const item = document.createElement('div');
            item.className = 'site-item';
            item.setAttribute('data-name', site.name.toLowerCase());
            
            const safeId = site.name.replace(/\s+/g, '');
            item.innerHTML = `
                <div class="site-info"><a href="${site.url}" target="_blank">${site.name}</a></div>
                <div class="status-container">
                    <span class="status-text" id="text-${safeId}">Testing</span>
                    <div class="status-dot" id="dot-${safeId}"></div>
                </div>
            `;
            container.appendChild(item);
            setTimeout(() => item.classList.add('visible'), 50);
            testNetwork(site, safeId);
        }

        async function testNetwork(site, safeId) {
            const dot = document.getElementById(`dot-${safeId}`);
            const txt = document.getElementById(`text-${safeId}`);
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);

            try {
                await fetch(site.url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal, cache: 'no-store' });
                clearTimeout(timeoutId);
                dot.className = 'status-dot online';
                txt.textContent = "Open";
                txt.style.color = "#22c55e";
                activeStatuses[site.name] = "open";
            } catch (error) {
                dot.className = 'status-dot offline';
                txt.textContent = "Blocked";
                txt.style.color = "#ef4444";
                activeStatuses[site.name] = "blocked";
            }
            updateCounters();
        }

        function updateCounters() {
            let open = 0, blocked = 0;
            for (let n in activeStatuses) {
                if (activeStatuses[n] === "open") open++;
                if (activeStatuses[n] === "blocked") blocked++;
            }
            document.getElementById('stat-open').textContent = open;
            document.getElementById('stat-blocked').textContent = blockedCount = blocked;
        }

        document.getElementById('search-input').addEventListener('input', function(e) {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.site-item').forEach(item => {
                item.style.display = item.getAttribute('data-name').includes(val) ? 'flex' : 'none';
            });
        });

        window.onload = loadSites;
    </script>
</body>
</html>
